<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quotes</title>
    <base href="/" />
    <link rel="icon" type="image/png" href="favicon.png" />

    <!-- Enough to paint the boot screen before app.css lands, so the dynamic
         stylesheet below never flashes an unstyled frame. -->
    <style>
        html, body { margin: 0; padding: 0; background: #fafafa; }
        .boot { min-height: 100vh; display: grid; place-items: center; }
        .boot-bar { width: 160px; height: 2px; border-radius: 999px; background: #e4e4e7; overflow: hidden; }
        .boot-fill { display: block; height: 100%; width: var(--blazor-load-percentage, 0%); background: #4f46e5; }
    </style>

    <script>
        // The dev server sends no Cache-Control on these two, so after a rebuild
        // the browser silently reuses its old copies: stale CSS looks like broken
        // layout, and stale JS crashes the app when it calls a function the old
        // file doesn't have. The cost is that neither is ever cached — 20KB.
        (function () {
            var v = Date.now();

            var css = document.createElement('link');
            css.rel = 'stylesheet';
            css.href = 'css/app.css?v=' + v;
            document.head.appendChild(css);

            var js = document.createElement('script');
            js.src = 'js/app.js?v=' + v;
            js.async = false;
            document.head.appendChild(js);
        })();
    </script>
</head>

<body>
    <div id="app">
        <div class="boot" role="status" aria-label="Loading">
            <div class="boot-bar"><span class="boot-fill"></span></div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
