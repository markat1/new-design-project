<title>Prototype · afkrydsning i Outlook-stil</title>
<!-- PROTOTYPE: afkrydsning — throwaway, imported by nothing. Delete wwwroot/proto/ when decided. -->
<link rel="stylesheet" href="../css/app.css">
<style>
  /* ---------- tabellen, som appens egen ---------- */
  .bx-t { width: 100%; table-layout: fixed; border-collapse: separate; border-spacing: 0; font-size: 14px; }
  .bx-t th { padding: 0 10px 11px; border-bottom: 1px solid var(--line); font-size: 12px; line-height: 20px; font-weight: 500; color: var(--ink-3); text-align: left; }
  .bx-t td { padding: 10px 10px 9px; line-height: 20px; border-bottom: 1px solid var(--line); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bx-t .num { text-align: right; font-variant-numeric: tabular-nums; }
  .bx-t th:last-child, .bx-t td:last-child { width: 110px; }
  .bx-box { width: 36px; }
  /* Cellerne klipper som standard (ellipsis på navne), og det klipper også
     kassens klikflade. Kun afkrydsningskolonnen får lov at lade den stå ud. */
  /* z-index, fordi cellen ved siden af males ovenpå og ellers spiser den del
     af klikfladen, der stikker ind under navnet. */
  .bx-t td.bx-box, .bx-t th.bx-box { overflow: visible; position: relative; z-index: 1; }
  .bx-name { font-weight: 500; }
  .bx-co { color: var(--ink-2); }
  .bx-t tbody tr { cursor: pointer; }
  .bx-t tbody tr[data-shown] { background: var(--accent-soft); }
  .bx-t tbody tr:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .bx-t tbody tr:not([data-on]) td { color: var(--ink-3); }
  .bx-t tbody tr:not([data-on]) .bx-name { font-weight: 400; }
  @media (hover: hover) and (pointer: fine) {
    .bx-t tbody tr:hover { background: var(--hover); }
    .bx-t tbody tr[data-shown]:hover { background: var(--accent-soft); }
  }
  .bx-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 0 0 8px; padding-top: 11px; border-top: 1px solid var(--line); font-size: 13px; }
  .bx-head-s { font-size: 12px; font-weight: 400; color: var(--ink-3); }

  /* ---------- fælles for de fem kasser ---------- */
  /* En knap med role="checkbox": så følger form, streg og flueben huset, og
     Windows og macOS tegner ikke hver sin. Feltet er 16px at se på og 40px at
     ramme — pseudo-elementet vokser kun lodret, så naboerne ikke overlappes. */
  .bx {
    position: relative;
    display: grid; place-items: center;
    padding: 0;
    background: var(--surface);
    color: transparent;
    cursor: pointer;
    touch-action: manipulation;
    transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease, box-shadow 120ms ease;
  }
  /* 40x40 at ramme om en 16px kasse. Lodret 11, så to rækkers flader mødes
     uden at overlappe: der er 24px mellem kasserne. */
  .bx::after { content: ""; position: absolute; left: -12px; right: -12px; top: -11px; bottom: -11px; }
  /* Tæt har 19px mellem kasserne og kan kun nå 31px i højden uden at æde
     naboens. Det er variantens pris, ikke en fejl. */
  .bx-taet::after { top: -9px; bottom: -9px; }
  .bx svg { display: block; }
  .bx:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* 1 · Fluent 2 — Microsofts nuværende: 16px, 4px hjørner, fyldt accent. */
  .bx-fluent { width: 16px; height: 16px; border: 1px solid var(--ink-3); border-radius: 4px; }
  .bx-fluent[aria-checked="true"], .bx-fluent[aria-checked="mixed"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  @media (hover: hover) and (pointer: fine) {
    .bx-fluent:hover { border-color: var(--ink-1); }
    .bx-fluent[aria-checked="true"]:hover, .bx-fluent[aria-checked="mixed"]:hover { background: var(--accent-2); border-color: var(--accent-2); }
  }

  /* 2 · Office klassisk — firkantet, hvid, og fluebenet er blåt i stedet for
     en fyldt flade. Sådan tegner Excels filtermenu og de gamle Office-dialoger
     den, og det er den letteste af dem alle. */
  .bx-klassisk { width: 16px; height: 16px; border: 1px solid var(--ink-3); border-radius: 0; }
  .bx-klassisk[aria-checked="true"], .bx-klassisk[aria-checked="mixed"] { color: var(--accent); border-color: var(--accent); }
  @media (hover: hover) and (pointer: fine) {
    .bx-klassisk:hover { border-color: var(--ink-1); background: var(--accent-soft); }
  }

  /* 3 · Windows 11 — 18px, 4px hjørner, fyldt; tom kasse får en grå flade ved
     hover, og hele kassen trykker ved klik. */
  .bx-win11 { width: 18px; height: 18px; border: 1px solid var(--line-2); border-radius: 4px; }
  .bx-win11[aria-checked="true"], .bx-win11[aria-checked="mixed"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .bx-win11:active { transform: scale(0.94); }
  @media (hover: hover) and (pointer: fine) {
    .bx-win11[aria-checked="false"]:hover { background: var(--sunk); border-color: var(--ink-3); }
    .bx-win11[aria-checked="true"]:hover { background: var(--accent-2); border-color: var(--accent-2); }
  }
  @media (prefers-reduced-motion: reduce) { .bx-win11:active { transform: none; } }

  /* 4 · Outlook-liste — som når man markerer beskeder i indbakken: cirklen er
     der kun, når man er ved rækken, og den fyldes, når personen er med. */
  /* 20px cirkel med kun 20px mellem rækkerne: fladen må være 38 høj, ikke 42,
     ellers æder to rækkers flader hinanden. */
  .bx-liste::after { top: -9px; bottom: -9px; }
  .bx-liste { width: 20px; height: 20px; border: 1px solid var(--ink-3); border-radius: 50%; opacity: 0; }
  .bx-liste[aria-checked="true"], .bx-liste[aria-checked="mixed"] { opacity: 1; background: var(--accent); border-color: var(--accent); color: #fff; }
  tr:hover .bx-liste, .bx-liste:focus-visible, th .bx-liste { opacity: 1; }
  @media (hover: none) { .bx-liste { opacity: 1; } }

  /* 5 · Tæt — Excels tæthed: 13px kasse og 32px rækker, så otte personer fylder
     som otte linjer i et ark. */
  .bx-taet-rows .bx-t td { padding: 6px 10px 5px; }
  .bx-taet { width: 13px; height: 13px; border: 1px solid var(--ink-3); border-radius: 2px; }
  .bx-taet svg { width: 9px; height: 9px; }
  .bx-taet[aria-checked="true"], .bx-taet[aria-checked="mixed"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  @media (hover: hover) and (pointer: fine) { .bx-taet:hover { border-color: var(--ink-1); } }

.proto-picker {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2147483647;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 4px;
  border-radius: 999px;
  background: rgba(10, 10, 10, 0.82);
  -webkit-backdrop-filter: blur(12px) saturate(1.4);

  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.08) inset,
    0 8px 24px rgba(0, 0, 0, 0.24),
    0 2px 6px rgba(0, 0, 0, 0.12);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 13px;
  line-height: 1;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
}

.proto-picker-highlight {
  position: absolute;
  top: 4px;
  left: 0;
  height: 28px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.12);
  will-change: transform;
}

/* The slide is enabled only after first paint (data-ready), so load doesn't animate. */
.proto-picker[data-ready] .proto-picker-highlight {
  transition:
    transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
    width 250ms cubic-bezier(0.23, 1, 0.32, 1);
}

@media (prefers-reduced-motion: reduce) {
  .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
}

.proto-picker-item {
  position: relative; /* sits above the highlight */
  display: flex;
  align-items: center;
  height: 28px;
  padding: 0 12px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: rgba(255, 255, 255, 0.55);
  font: inherit;
  cursor: pointer;
  transition: color 150ms ease-out;
}

.proto-picker-item:hover {
  color: rgba(255, 255, 255, 0.85);
}

.proto-picker-item:active {
  transform: scale(0.97);
}

.proto-picker-item:focus-visible {
  outline: 2px solid rgba(255, 255, 255, 0.4);
  outline-offset: 2px;
}

.proto-picker-item[data-active] {
  color: #fff;
}

.proto-picker-divider {
  width: 1px;
  height: 16px;
  margin: 0 4px;
  background: rgba(255, 255, 255, 0.12);
}

.proto-picker-replay {
  padding: 0 10px;
  font-size: 14px;
}

.proto-picker[data-position="top"] {
  bottom: auto;
  top: 24px;
}

</style>

// Fluebenet er Fluents: to streger, runde ender, 2 i en 16-boks. Stregen
// følger knappens color, så den er hvid på fyldt og blå på hvid.
const TICK = '<svg width="11" height="11" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.2 8.6l3.1 3.1L12.8 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
// Halv tilstand: en streg, som Outlook viser, når kun nogle er valgt.
const DASH = '<svg width="11" height="11" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 8h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';

const SHAPES = ['fluent', 'klassisk', 'win11', 'liste', 'taet'];

const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');

let people = [];
function reset() {
  const doc = new DOMParser().parseFromString(F.app, 'text/html');
  people = [...doc.querySelectorAll('.pick-t tbody tr')].map((tr, i) => ({
    id: i,
    name: tr.querySelector('.pick-t-name').textContent.trim(),
    company: tr.querySelector('.pick-t-co').textContent.trim(),
    sum: tr.querySelector('.num').textContent.trim(),
    on: true,
    shown: i === 0,
  }));
}
const on = () => people.filter(p => p.on);

// "Vælg alle" har tre tilstande, ikke to: alle, ingen, og nogle.
const allState = () => on().length === people.length ? 'true' : on().length === 0 ? 'false' : 'mixed';

const box = (shape, state, extra, label) => `<button type="button" class="bx bx-${shape}" role="checkbox"
    aria-checked="${state}" ${extra} aria-label="${esc(label)}">${state === 'mixed' ? DASH : TICK}</button>`;

const variants = SHAPES.map(shape => ({
  cls: shape === 'taet' ? 'bx-taet-rows' : '',
  body: () => `<p class="bx-head"><span>${on().length} af ${people.length} personer med</span>
      <span class="bx-head-s">Klik en række for at se prislisten</span></p>
    <table class="bx-t"><thead><tr>
      <th class="bx-box">${box(shape, allState(), 'data-all', 'Vælg alle')}</th>
      <th>Person</th><th>Kunde</th><th class="num">Prisliste</th>
    </tr></thead><tbody>
    ${people.map(p => `<tr data-row="${p.id}" tabindex="0"${p.on ? ' data-on=""' : ''}${p.shown ? ' data-shown=""' : ''}>
      <td class="bx-box">${box(shape, String(p.on), `data-box="${p.id}"`, 'Med i udsendelsen: ' + p.name)}</td>
      <td class="bx-name" title="${esc(p.name)}">${esc(p.name)}</td>
      <td class="bx-co" title="${esc(p.company)}">${esc(p.company)}</td>
      <td class="num">${p.sum}</td>
    </tr>`).join('')}
    </tbody></table>`,
}));
const behaviours = variants;

const app = document.getElementById('pv-app');

function render() {
  app.innerHTML = F.app;
  app.className = variants[current].cls;
  const fields = app.querySelector('.f-fields');
  [...fields.querySelectorAll('.pick-count, .pick-t, .f-help')].forEach(el => el.remove());
  fields.insertAdjacentHTML('beforeend', variants[current].body()
    + '<p class="f-help">Beløbene kommer fra regnskabssystemet. To personer hos samme kunde får den samme prisliste.</p>');
}

app.addEventListener('click', e => {
  const t = e.target.closest('[data-box], [data-all], [data-row]');
  if (!t) return;
  if (t.hasAttribute('data-all')) {
    const allOn = on().length === people.length;
    people.forEach(p => { p.on = !allOn; });
    render();
    return app.querySelector('[data-all]')?.focus({ preventScroll: true });
  }
  if (t.dataset.box !== undefined) {
    const p = people.find(x => x.id === +t.dataset.box);
    p.on = !p.on;
    render();
    return app.querySelector(`[data-box="${p.id}"]`)?.focus({ preventScroll: true });
  }
  // Klik på rækken viser prislisten — det er rækkens egen betydning i appen.
  people.forEach(p => { p.shown = p.id === +t.dataset.row; });
  render();
  app.querySelector(`tr[data-row="${t.dataset.row}"]`)?.focus({ preventScroll: true });
});

app.addEventListener('keydown', e => {
  // Kun når rækken selv har fokus: står fokus på kassen, er tasten kassens.
  if (!e.target.matches?.('tr[data-row]') || (e.key !== 'Enter' && e.key !== ' ')) return;
  e.preventDefault();
  e.target.click();
});

// Harness: varianterne tegner gennem render().
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function mount() {
  reset();
  render();
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount();
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount());
window.addEventListener('resize', moveHighlight);

document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount();
});

setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
// Enable the slide only after first paint, so load doesn't animate.
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));

</script>
